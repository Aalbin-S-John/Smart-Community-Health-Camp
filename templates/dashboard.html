{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<div class="form-card">

    <h2>{{ title }}</h2>

    <p class="text-muted">
        Welcome, {{ session.get('username') }}!
    </p>

    <hr>

    <h5>Account Information</h5>

    <p>
        <strong>Username:</strong>
        {{ session.get('username') }}
    </p>

    <p>
        <strong>Role:</strong>
        {{ role }}
    </p>

    <div class="alert alert-success mt-4">
        You have successfully logged in.
    </div>

</div>

{% endblock %}
