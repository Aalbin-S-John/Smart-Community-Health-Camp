{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm mx-auto" style="max-width: 650px;">

        <div class="card-header bg-white">
            <h3 class="mb-0">Add New Doctor</h3>
        </div>

        <div class="card-body">

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Doctor's Full Name *</label>
                    <input type="text" name="full_name" class="form-control" placeholder="e.g. Dr. Ananya Sharma"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Username *</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address *</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password *</label>
                    <input type="password" name="password" class="form-control" minlength="8" required>
                    <small class="text-muted">
                        Minimum 8 characters.
                    </small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Specialization</label>
                    <select name="specialization" class="form-select">
                        <option value="">Select specialization</option>
                        <option>General Physician</option>
                        <option>Cardiologist</option>
                        <option>Dermatologist</option>
                        <option>Ophthalmologist</option>
                        <option>Paediatrician</option>
                        <option>Gynaecologist</option>
                        <option>Dentist</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mobile Number</label>
                    <div class="input-group">
                        <span class="input-group-text">+91</span>
                        <input type="tel" name="phone" class="form-control" maxlength="10" pattern="[0-9]{10}"
                            placeholder="10-digit mobile number">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Create Doctor Account
                    </button>

                    <a href="{{ url_for('doctors.list_doctors') }}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
